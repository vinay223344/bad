<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Registration Portal</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e0e7ff;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .main-card {
            background: white;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .form-section {
            margin-bottom: 25px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-spacing: 0 10px;
        }
        label { font-weight: 600; color: #444; }
        input[type="text"], input[type="email"], input[type="tel"], select {
            width: 90%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background-color: #3730a3; }
    </style>
</head>
<body>

    <div class="main-card">
        <header>
            <h1 style="color: #1e1b4b; text-align: center;">Join the Community</h1>
            <p style="text-align: center; color: #666;">Please fill out the details below</p>
        </header>

        <form id="regForm">
            
            <section class="form-section">
                <h3 style="margin-top: 0; color: #4f46e5;">1. Contact Info</h3>
                <table>
                    <tr>
                        <td><label for="user">Full Name</label></td>
                        <td><input type="text" id="user" name="user" required minlength="3"></td>
                    </tr>
                    <tr>
                        <td><label for="userEmail">Email Address</label></td>
                        <td><input type="email" id="userEmail" name="userEmail" placeholder="you@example.com" required></td>
                    </tr>
                    <tr>
                        <td><label for="phone">Phone Number</label></td>
                        <td>
                            <input type="tel" id="phone" name="phone" 
                                   pattern="[0-9]{10}" 
                                   placeholder="10 digit number" required>
                        </td>
                    </tr>
                </table>
            </section>

            <section class="form-section">
                <h3 style="margin-top: 0; color: #4f46e5;">2. Experience</h3>
                <div style="padding: 10px;">
                    <label>What is your primary skill?</label><br><br>
                    <input type="radio" id="dev" name="skill" value="Developer"> <label for="dev">Developer</label>
                    <input type="radio" id="des" name="skill" value="Designer"> <label for="des">Designer</label>
                    <input type="radio" id="oth" name="skill" value="Other"> <label for="oth">Other</label>
                </div>
            </section>

            <section class="form-section">
                <label>Terms of Service (Read carefully):</label>
                <iframe 
                    style="margin-top:10px; width:100%; height:80px; border:1px dashed #999;"
                    srcdoc="<html><body style='font-family:sans-serif; font-size:12px;'>
                            <h4>Legal Notice</h4>
                            <p>By registering, you agree to follow our code of conduct. 
                            <b>No spamming</b> and <b>Respect others</b>.</p>
                            </body></html>">
                </iframe>
                <div style="margin-top:10px;">
                    <input type="checkbox" id="agree" required> 
                    <label for="agree">I accept the terms above</label>
                </div>
            </section>

            <div style="text-align: center;">
                <button type="submit" class="btn-submit" style="box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    Complete Registration
                </button>
            </div>

        </form>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevents the page from refreshing
            
            // Collect values
            const name = document.getElementById('user').value;
            const email = document.getElementById('userEmail').value;
            const phone = document.getElementById('phone').value;
            
            // Display something to the user
            alert("Success! \nName: " + name + "\nEmail: " + email + "\nPhone: " + phone + "\n\nYour data has been captured.");
        });
    </script>

</body>
</html>
