<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Master HTML Form</title>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Success Message Logic (Pure CSS) */
        #success-msg {
            display: none; 
            background: #d4edda;
            color: #155724;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }
        #success-msg:target { display: block; }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        label { font-weight: bold; }
        .btn-reset {
    background-color: #f8fafc;
    color: #64748b;
    border-color: #e2e8f0;
}
        input, select, textarea { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Visual validation for Age/Numbers */
        input:not(:placeholder-shown):invalid { border: 2px solid #e74c3c; background: #fdeaea; }
        input:not(:placeholder-shown):valid { border: 2px solid #2ecc71; }

        /* Style for Radio/Checkboxes to prevent stretching */
        input[type="radio"], input[type="checkbox"] { width: auto; margin-right: 5px; }
        
        /* Iframe styling */
        iframe { width: 100%; height: 120px; border: 1px dashed #444; background: #fafafa; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="success-msg">
        <strong>✔ Success!</strong> Your registration has been processed successfully.
        <br>
    </div>

    <header style="text-align: center;">
        <h1 style="margin: 0; color: #2c3e50;">Registration Portal</h1>
        <p>Complete Form with Gender, DOB, and Age Validation</p>
    </header>

    <form action="#success-msg" method="GET">
        
        <section>
            <h3 style="color: #3498db;">Step 1: Identity & Contact</h3>
            <table>
                <tr>
                    <td><label>Full Name:</label></td>
                    <td><input type="text" name="user" required minlength="3" placeholder="Enter Full Name"></td>
                </tr>
                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male" required> <label for="male" style="font-weight:normal;">Male</label>
                        <input type="radio" id="female" name="gender" value="female"> <label for="female" style="font-weight:normal;">Female</label>
                        <input type="radio" id="other" name="gender" value="other"> <label for="other" style="font-weight:normal;">Other</label>
                    </td>
                </tr>
                <tr>
                    <td><label>Date of Birth:</label></td>
                    <td><input type="date" name="dob" required></td>
                </tr>
                <tr>
                    <td><label>Age (18-99):</label></td>
                    <td>
                        <input type="number" name="age" min="18" max="99" required placeholder="Must be 18+">
                    </td>
                </tr>
                <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" name="email" required placeholder="example@mail.com"></td>
                </tr>
                <tr>
                    <td><label>Phone:</label></td>
                    <td><input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10 digit number" required></td>
                </tr>
            </table>
        </section>

        <section>
            <h3 style="color: #3498db;">Step 2: Choices & Selections</h3>
            <div style="padding: 15px; background: #f9f9f9; border-radius: 5px; border: 1px solid #eee;">
                <label>Select Department:</label>
                <select name="dept" required>
                    <option value="">-- Choose One --</option>
                    <option value="tech">Technology</option>
                    <option value="hr">Human Resources</option>
                    <option value="mkt">Marketing</option>
                </select>
                
                <br><br>

                <label>Subscriptions:</label><br>
                <input type="checkbox" id="news" name="sub" value="newsletter"> 
                <label for="news" style="font-weight: normal;">Weekly Newsletter</label>
                <input type="checkbox" id="alerts" name="sub" value="alerts"> 
                <label for="alerts" style="font-weight: normal;">Sms Alerts</label>
            </div>
        </section>

        <section>
            <h3 style="color: #3498db;">Step 3: Advanced Details</h3>
            <table>
                <tr>
                    <td><label>Bio (Textarea):</label></td>
                    <td><textarea name="bio" rows="3" placeholder="Tell us about yourself..."></textarea></td>
                </tr>
                <tr>
                    <td><label>Favorite Color:</label></td>
                    <td><input type="color" name="favcolor" style="height: 40px; cursor: pointer;"></td>
                </tr>
            </table>
        </section>

        <section>
            <label>Detailed Privacy Policy (Iframe):</label>
            <iframe srcdoc="
                <body style='font-family:sans-serif; font-size:13px; line-height:1.6; color:#333;'>
                    <h4 style='color:#e67e22; margin-top:0;'>1. Data Usage</h4>
                    <p>By filling this form, you agree to allow us to process your <b>Personal Identity</b> for registration purposes only.</p>
                    <h4 style='color:#e67e22;'>2. Cookie Policy</h4>
                    <ul>
                        <li>We use session cookies for security.</li>
                        <li>We never track your external browsing history.</li>
                    </ul>
                    <h4 style='color:#e67e22;'>3. Age Restriction</h4>
                    <p>Users under 18 are not permitted to register without parental consent.</p>
                </body>"></iframe>
            <div style="margin-top:10px;">
                <input type="checkbox" id="agree" required> <label for="agree" style="font-weight:normal;">I agree to the terms in the iframe.</label>
            </div>
        </section>
    <center>
    <input type="reset" value="Reset Form" 
           style="width: auto; padding: 12px 40px; cursor: pointer; background: #95a5a6; color: white; border: none; border-radius: 5px; font-weight: bold;">
    
    <button class="a1" type="submit" 
            style="width: auto; padding: 12px 40px; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 5px; font-weight: bold;">
        Register Now
    </button>
</center>

    </form>
</div>

</body>
</html>
